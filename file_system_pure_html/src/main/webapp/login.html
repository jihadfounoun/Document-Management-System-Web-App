<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
<title>Login page</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container" th:if="${login_mode}==true">
     <h2>Welcome to our online file storage service</h2>
        <div class="login-title">Insert your credentials to Login</div><br>
        <div class="form-container">
        <form method="post" action="Login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" placeholder="Enter your username" name="username" required></input>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" placeholder="Enter your password" name="password" required></input>
            </div>
            <button type="submit">Login</button>
        </form>
        </div>
        <div th:if="${error}" th:text="${error}" class="error"></div>
        <br>
        <a th:href="@{GoToRegister}">Sign up</a>
    </div>

    <div class="container" th:unless="${login_mode}==true">
    <h2>Welcome to our online file storage service</h2>
        <div class="register-title">Insert the required fields to register</div><br>
        <div class="form-container">
        <form method="post" action="Register">
            <div class="form-group">
                <label for="name">First Name</label>
                <input type="text" placeholder="Enter your first name" name="name" th:value="${name}" required></input>
                
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" placeholder="Enter your username" name="username" required></input>
            </div>
            <div class="form-group">
                <label for="email">Email    </label>
                <input type="email" placeholder="Enter your email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password      </label>
                <input type="password" placeholder="Enter your password" name="password" required></input>
            </div>
            <div class="form-group">
                <label for="repeated_password">Repeat Password</label>
                <input type="password" placeholder="Repeat your password" name="repeated_password" required></input>
            </div>
            <button type="submit">Register</button>
        </form>
        </div>
        <div th:text="${error}" class="error"></div>
        <br>
        <a th:href="@{/}">Login</a>
    </div>
</body>
</html>
